    q: "Ainsi, au Canada, le système de sélection des immigrants, implanté depuis 1967, octroie à chacun des points en fonction notamment du niveau de scolarité, de l’expérience professionnelle et de la maîtrise des langues o cielles. Malgré une certaine lourdeur administrative, ce système, qui a fait l’objet de révisions en 2016, réussit à faciliter l’arrivée au pays des immigrants quali és (Kapur et McHale, 2005). Les pays en développement fournissent donc un bassin de main-d’œuvre sous-utilisée et de mieux en mieux formée. Cependant, le dé  pour les pays industrialisés consiste à attirer cette main-d’œuvre étrangère et à l’intégrer au marché du travail, et ce, sans perturber leur équilibre démographique fragile. Or, l’intégration au marché du travail des immigrants, même hautement quali és, n’est pas chose facile, notamment parce que les candidats ne parlent pas toujours bien la langue du pays de destination. En outre, trouver et recruter des immigrants implique un coût et des e orts supplémentaires pour les employeurs, comme nous aurons l’occasion de le constater dans le chapitre 9. Par ailleurs, en raison de l’accroissement du niveau de formation de leurs populations, plusieurs pays en développement font eux-mêmes concurrence aux économies industrialisées. Plutôt que de subir un exode des cerveaux qui ne ferait qu’a aiblir l’économie locale, certains pays comme la Chine ou l’Inde déploient beaucoup d’e orts pour obtenir des contrats pour le compte d’entreprises multinationales qui souhaitent délocaliser leurs activités. Ces pays en développement entrent donc en concurrence directe avec les économies industrialisées, tant sur le plan des RH que sur celui de la production de biens et services",
    a: ""
  },
  {
    q: "Quant au marché du travail canadien, il se caractérise par la réalité duale du chômage et de la rareté de main-d’œuvre quali ée, qui pose aux employeurs un paradoxe en matière de RH : celui de la pénurie au milieu de l’abondance. Le problème ne tient donc pas tant au nombre de candidats potentiels qu’à l’inadéquation des compétences",
    a: ""
  },
  {
    q: "Une organisation doit établir une stratégie de gestion des RH avant de se lancer dans le recrutement. 54 Comme nous l’avons vu précédemment, les pouvoirs publics doivent agir pour limiter les déséquilibres anticipés de main-d’œuvre, par exemple en révisant leurs politiques d’immigration ou en favorisant la formation de la main-d’œuvre. Cependant, la responsabilité des activités de dotation en personnel revient ultimement aux organisations qui se font concurrence pour tenter d’attirer ces talents. Or, si certaines entreprises béné cient d’une grande notoriété qui leur donne une longueur d’avance dans le recrutement, toutes doivent faire preuve d’innovation et de rigueur pour cerner avec soin leurs besoins de main-d’œuvre et concevoir des stratégies de recrutement appropriées à la situation. 1.3.1 L’établissement d’une stratégie de dotation Si, à une époque passée où la main-d’œuvre était abondante, les organisations pouvaient se permettre de recruter au dernier moment, cela n’est plus possible aujourd’hui. Les employeurs doivent donc établir une stratégie de gestion des RH qui inclut à la fois le développement des compétences à l’interne, l’attraction de candidats de l’extérieur et la rétention des employés, notamment dans les emplois où le recrutement de personnel est di cile (Mercer, 2011). Or, seule une minorité d’organisations, de l’ordre de 20 % selon certaines sources, semble disposer d’une véritable stratégie de gestion des RH solide et alignée sur la stratégie d’entreprise (Beames, 2015)",
    a: ""
  },
  {
    q: "l’élaboration d’une telle stratégie doit partir des résultats organisationnels attendus et de la contribution des RH à ces résultats. Par la suite, l’organisation doit déterminer les compétences dont elle aura besoin pour atteindre ses objectifs, et identi er les écarts entre les compétences disponibles et les compétences recherchées. S’o re alors une diversité de moyens pour rétablir l’équilibre entre les demandes et les disponibilités : avoir recours à une main d’œuvre externe temporaire, mettre en place des mesures pour conserver les employés clés, développer les talents à l’interne et faire preuve d’innovation pour attirer des candidats talentueux (Beames, 2015)",
    a: ""
  },
  {
    q: "La connaissance du marché du travail Nous l’avons vu précédemment, le marché du travail canadien se caractérise par la coexistence d’une main-d’œuvre spécialisée, largement sollicitée et insu sante en nombre pour satisfaire les besoins de l’économie, et d’un nombre élevé de chômeurs, dont les compétences ne semblent pas en adéquation avec les exigences des emplois. Aux prises avec cette dualité du marché du travail, les employeurs doivent déployer des stratégies di érentes a n de pourvoir les postes vacants. Par exemple, pour les professions peu spécialisées, le dé  est double : pour certains postes, il consiste à gérer un grand nombre de candidats qui cherchent à intégrer un secteur du marché du travail en déclin ; pour d’autres, au contraire, il nécessite d’attirer des personnes rebutées par l’image dévalorisée du secteur d’activité ou de l’emploi",
    a: ""
  },
  {
    q: ". Comme nous le verrons dans le chapitre 8, la connaissance des divers acteurs permet de cibler les actions de recrutement. Par exemple, utiliser le bulletin mensuel d’une association professionnelle pour annoncer un poste spécialisé se révèle habituellement plus e cace que publier une annonce similaire dans le quotidien local. Une bonne compréhension des attentes des candidats est aussi nécessaire pour attirer les talents recherchés. Savoir quel est le salaire moyen o ert pour le poste à pourvoir est un minimum, mais au-delà des considérations nancières, il est nécessaire de connaître les conditions de travail proposées par la concurrence, d’évaluer les possibilités d’avancement professionnel ou d’a ectation à l’étranger qui peuvent être o ertes au candidat ou encore de se pencher sur ses attentes en matière de exibilité des horaires (Chapman et al., 2005). Cette compréhension est particulièrement importante à l’heure où arrivent dans la population active les individus de la génération Y, dont les valeurs di èrent souvent de celles de leurs aînés. Le marché du travail étant en constante évolution, cette connaissance n’est jamais acquise de façon dé nitive. Les formations évoluent, les concentrations de chômage se déplacent géographiquement, les compétences recherchées changent, les concurrents disparaissent ou naissent. Une partie importante du travail d’un recruteur, souvent sous estimée, consiste donc, par des activités de réseautage et de veille, à se tenir continuellement à l’a ût de l’évolution du marché du travail. Cette connaissance permet ensuite de développer des stratégies de dotation adaptées à chaque situation. Si une bonne compréhension du marché du travail est indispensable pour adopter des stratégies de dotation e caces, un élément est tout aussi important à connaître : l’encadrement juridique des activités de recrutement et de sélection. La dotation est en e et un domaine particulièrement soumis à des contraintes légales, qui feront l’objet du chapitre 2",
    a: ""
  },
  {
    q: "la stratégie de dotation choisie doit être adaptée à l’organisation et au poste à pourvoir. 1.3.3 La diversi cation et la personnalisation Compte tenu de la diversité des besoins et de la rareté de certains pro ls, un recruteur doit nécessairement développer une approche di érente en fonction du poste à pourvoir et des particularités du marché du travail. Par exemple, a n de pourvoir rapidement un grand nombre de postes peu quali és, organiser une journée porte ouverte au cours de laquelle se déroulent les entrevues de sélection peut s’avérer une stratégie très e cace. Cela fait partie d’une des stratégies adoptées par Kevin Miller dans la mise en situation présentée en début de chapitre. Une telle stratégie serait toutefois impensable dans le cas d’un poste très spécialisé, car ce type de recrutement requiert une approche beaucoup plus personnalisée par laquelle les interactions avec un candidat sont adaptées en fonction de la disponibilité de celui-ci. Diversi er les approches signi e également ne pas se contenter de cibler toujours le même groupe de candidats potentiels. Comme nous l’avons vu plus tôt, le marché du travail possède des bassins importants de travailleurs sans emploi ou sous-employés qui pourraient être intégrés à la population active. Ainsi, les jeunes chômeurs, les parents d’enfants en bas âge, les personnes handicapées, les jeunes retraités qui désirent conserver une certaine activité professionnelle, les travailleurs d’un secteur d’activité en déclin ou les immigrants dont les diplômes ne sont pas reconnus en totalité constituent autant de sources de candidats potentiels. Certes, ces candidats peuvent avoir des besoins particuliers, comme une formation d’appoint ou une certaine exibilité dans les horaires, mais ils n’en constituent pas moins une source intéressante de talents. Les personnes qui ne sont pas activement à la recherche d’un emploi constituent un autre bassin de candidats potentiels souvent négligé. Ici encore, les activités de réseautage d’un recruteur peuvent lui permettre de rencontrer des personnes qui, même si elles ne souhaitent pas changer d’emploi à court terme, peuvent devenir des candidats par la suite. Multiplier les bassins de recrutement non traditionnels peut également signi er, dans certains cas, étendre la zone géographique de recherche d’un candidat. Par exemple, de 2010 à 2015, plusieurs entreprises de l’Alberta aux prises avec une pénurie importante de main-d’œuvre ont recruté des candidats dans les autres provinces de l’Ouest, et même en Ontario et au Québec. Les données de 2017 con rment le renversement de cette tendance amorcé en 2015 lorsque la province a enregistré des pertes migratoires interprovinciales en raison du tassement de son économie (Statistique Canada, 2017s). Toutefois, la migration internationale compense, pour les provinces visées, la perte de population active causée par la migration interprovinciale. Le recrutement international soutient donc l’expansion du marché de la main-d’œuvre. Nous y reviendrons dans le chapitre 9. À ce sujet, reprenons le cas de l’entreprise Logival : le directeur des RH explore la possibilité de recruter des travailleurs étrangers pour venir occuper des postes peu quali és dans son usine de Québec. Ainsi, les employeurs doivent faire preuve d’imagination pour cibler de nouveaux bassins de main-d’œuvre. Attirer ces candidats nécessite cependant une ré exion sur ce que l’organisation est prête à o rir à de nouveaux employés, c’està-dire sur son positionnement en tant qu’employeur",

const markedCards = new Set();

function updateErrorCount() {
  const count = markedCards.size;
  document.getElementById('errorBadge').textContent = count;
  document.getElementById('modalErrorCount').textContent = count;

  const total = cards.length;
  const successful = Math.max(0, total - count);
  const percentage = total ? Math.round((successful / total) * 100) : 0;
  document.getElementById('successPercent').textContent = percentage + ' %';
  document.getElementById('successFill').style.width = percentage + '%';
  document.querySelector('.success-track').setAttribute('aria-valuenow', percentage);
  document.getElementById('successDetails').textContent =
    `${count} carte${count === 1 ? '' : 's'} en rouge · ${successful} carte${successful === 1 ? '' : 's'} réussie${successful === 1 ? '' : 's'} sur ${total}`;
}

function createCardFace(item, isErrorList = false) {
  const wrap = document.createElement('div');
  if (isErrorList) {
    wrap.className = 'error-card';
    wrap.innerHTML = `<button class="unmark-btn" type="button" aria-label="Retirer cette carte des cartes d'erreurs" title="Remettre cette carte en normal"></button>
      <strong>${escapeHtml(item.q)}</strong><div class="answer">${escapeHtml(item.a)}</div>`;
    wrap.querySelector('.unmark-btn').addEventListener('click', (event) => {
      event.stopPropagation();
      markedCards.delete(item);
      render();
      renderErrorCards();
    });
    wrap.addEventListener('click', () => wrap.classList.toggle('flipped'));
    return wrap;
  }

  wrap.className = 'card-wrap' + (markedCards.has(item) ? ' marked' : '');
  wrap.innerHTML = `
    <div class="card">
      <div class="face front">
        <div>${escapeHtml(item.q)}</div>
        <div class="hint">Clique pour voir la réponse 👆</div>
      </div>
      <div class="face back">
        <div>${escapeHtml(item.a)}</div>
        <div class="hint">Clique pour revenir à la question 👆</div>
      </div>
    </div>`;

  const markBtn = document.createElement('button');
  markBtn.className = 'mark-btn' + (markedCards.has(item) ? ' marked' : '');
  markBtn.type = 'button';
  markBtn.setAttribute('aria-label', markedCards.has(item) ? 'Retirer des cartes d’erreurs' : 'Marquer cette question comme erreur');
  markBtn.title = markedCards.has(item) ? 'Carte marquée comme erreur' : 'Marquer comme erreur';
  wrap.appendChild(markBtn);

  markBtn.addEventListener('click', (event) => {
    event.stopPropagation();
    if (markedCards.has(item)) markedCards.delete(item);
    else markedCards.add(item);
    render();
    renderErrorCards();
  });

  wrap.addEventListener('click', () => {
    wrap.querySelector('.card').classList.toggle('flipped');
  });
  return wrap;
}

function render() {
  const container = document.getElementById('cards');
  container.innerHTML = '';
  document.getElementById('count').textContent = cards.length;
  cards.forEach(item => container.appendChild(createCardFace(item)));
  updateErrorCount();
}

function renderErrorCards() {
  const container = document.getElementById('errorCardsList');
  container.innerHTML = '';
  const errorCards = cards.filter(item => markedCards.has(item));
  document.getElementById('modalErrorCount').textContent = errorCards.length;
  document.getElementById('errorBadge').textContent = errorCards.length;
  if (errorCards.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-errors';
    empty.textContent = 'Aucune carte en rouge pour le moment. Clique sur le point rouge d’une carte pour l’ajouter ici.';
    container.appendChild(empty);
    return;
  }
  errorCards.forEach(item => container.appendChild(createCardFace(item, true)));
}

const errorModalOverlay = document.getElementById('errorModalOverlay');
document.getElementById('errorBubble').addEventListener('click', () => {
  renderErrorCards();
  errorModalOverlay.classList.add('open');
});
document.getElementById('closeErrorModal').addEventListener('click', () => errorModalOverlay.classList.remove('open'));
errorModalOverlay.addEventListener('click', event => {
  if (event.target === errorModalOverlay) errorModalOverlay.classList.remove('open');
});
document.addEventListener('keydown', event => {
  if (event.key === 'Escape') errorModalOverlay.classList.remove('open');
});

function escapeHtml(value) {
  return value
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");
}

document.getElementById('shuffleBtn').addEventListener('click', () => {
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  render();
  window.scrollTo({top: 0, behavior: 'smooth'});
});

render();
</script>
